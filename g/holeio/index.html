<<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <title>Hole.io</title>
  <link rel="icon" type="image/x-icon" href="/images/favicon.png">

  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: #000416;
      overflow: hidden;
    }

    #container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000416;
    }

    #gameContainer {
      width: 100%;
      height: 100%;
    }

    #logo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 10;
    }

    #loadinginfo {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: red;
      font-size: 18px;
    }

    #footer {
      display: none;
    }
  </style>

  <script src="Build/UnityLoader.js"></script>
  <script>
    function UnityProgress(gameInstance, progress) {
      const logo = document.getElementById("logo");
      const loading = document.getElementById("loadinginfo");

      if (!gameInstance.Module) return;

      if (progress === "complete") {
        logo.style.display = "none";
        return;
      }

      if (progress === 1) {
        loading.textContent = "Loading... (This might take 1-2 minutes)";
      } else if (progress > 0) {
        loading.textContent = "Loading: " + Math.round(progress * 100) + "%";
        if (progress * 100 >= 90) loading.textContent = "Loading... (This might take 1-2 minutes)";
      }
    }

    const gameInstance = UnityLoader.instantiate("gameContainer", "Build/BuildWeb.json", {
      onProgress: UnityProgress,
      Module: {
        onRuntimeInitialized: function() {
          UnityProgress(gameInstance, "complete");
        }
      }
    });
  </script>
</head>

<body>
  <div id="container">
    <div id="gameContainer"></div>
    <div id="logo">
      <img src="feature800x470.png" width="100%" height="auto" alt="Game Loading...">
      <div id="loadinginfo">Loading...</div>
    </div>
  </div>

  <script>
    function CreateLinksInGame() {
      window.open("https://selenite.cc", "_blank");
    }
  </script>
</body>
</html>
